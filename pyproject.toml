[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanefactor"
version = "0.10.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.133.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pandas>=3.0.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.47",
    "tqdm>=4.70.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lanefactor*"]
